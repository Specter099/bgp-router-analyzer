name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8 mypy ruff

      - name: Ruff check
        run: ruff check .

      - name: Flake8
        run: flake8 bgp_route_analyzer.py --max-line-length 120

      - name: Mypy
        run: mypy bgp_route_analyzer.py --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8 mypy ruff

      - name: Run tests
        run: python -m pytest tests/ -v

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Typecheck
        working-directory: ui
        run: npm run lint

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Verify build output
        working-directory: ui
        run: test -f dist/index.html && test -d dist/assets

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bgp-route-analyzer:ci

      - name: Start container
        run: |
          set -euo pipefail
          docker run -d --name bgp-ci \
            -e BGP_ANALYZER_API_KEY=ci-test-key \
            -p 127.0.0.1:8000:8000 \
            bgp-route-analyzer:ci

      - name: Wait for healthcheck
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' bgp-ci)"
            echo "health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            if [ "$status" = "unhealthy" ]; then break; fi
            sleep 2
          done
          echo "container never became healthy"
          exit 1

      - name: Verify auth, UI, and non-root runtime
        run: |
          set -euo pipefail

          # Unauthenticated API access is refused.
          code="$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/snapshots)"
          if [ "$code" != "403" ]; then echo "expected 403, got $code"; exit 1; fi

          # Authenticated access works.
          code="$(curl -s -o /dev/null -w '%{http_code}' -H 'X-API-Key: ci-test-key' localhost:8000/snapshots)"
          if [ "$code" != "200" ]; then echo "expected 200, got $code"; exit 1; fi

          # The admin UI is built into the image and served.
          curl -sf localhost:8000/ui | grep -q '<div id="root">'

          # The process must not run as root.
          uid="$(docker exec bgp-ci id -u)"
          if [ "$uid" != "10001" ]; then echo "expected uid 10001, got $uid"; exit 1; fi

          # The database must land on the /data volume, owned by the app user.
          docker exec bgp-ci test -f /data/bgp_snapshots.db

      - name: Container logs
        if: always()
        run: docker logs bgp-ci || true

      - name: Clean up
        if: always()
        run: docker rm -f bgp-ci || true
